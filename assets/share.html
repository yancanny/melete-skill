<!doctype html>
<!--
  Melete 分享模板（长图与 HTML 共用）。
  - 由 scripts/render-share.mjs 填写；不能运行脚本时，按下面的规则手工填：
    {{字段}}                    换成 share.json 里对应的文字（要转义 < > &）。
    <!-​-if:字段-​->…<!-​-/if:字段-​->   字段为空时整段删掉。
    <!-​-each:列表-​->…<!-​-/each:列表-​->  按列表里的每一项复制一份；{{.value}} 等是该项的字段，{{.n}} 是罗马数字序号。
    {{label.xxx}}               版块标题，中文默认值见 render-share.mjs 的 LABELS。
  - 不要加 <script>、外部字体、外部图片。
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root {
    --paper: #F4EEE3;
    --card: #FBF8F2;
    --ink: #1F1B16;
    --muted: #6E655A;
    --line: #DCD2C2;
    --accent: #A4492A;
    --sage: #E9ECE3;
    --sage-ink: #3F4D3A;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); }
  body {
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 1080px;
    max-width: 100%;
    padding: 96px 88px 72px;
    position: relative;
  }
  .frame {
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 72px 64px 56px;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%);
  }
  .mark {
    display: flex; align-items: center; gap: 18px;
    font-size: 22px; letter-spacing: .32em; color: var(--muted);
    text-transform: uppercase;
  }
  .mark svg { flex: none; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 72px; line-height: 1.22;
    margin-top: 40px;
    letter-spacing: .01em;
  }
  .range { margin-top: 24px; font-size: 26px; color: var(--muted); }
  .by { margin-top: 6px; font-size: 22px; color: var(--muted); opacity: .85; }
  .rule {
    display: flex; align-items: center; gap: 20px;
    margin: 56px 0 48px; color: var(--accent);
  }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .numbers { display: flex; gap: 24px; }
  .num {
    flex: 1; min-width: 0;
    background: var(--card); border-radius: 18px;
    padding: 36px 28px 30px;
    border: 1px solid #EAE2D4;
  }
  .num .v {
    font-family: var(--serif); font-weight: 600;
    font-size: 64px; line-height: 1.1; color: var(--accent);
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .num .l { margin-top: 14px; font-size: 24px; line-height: 1.45; color: var(--muted); }

  h2 {
    font-size: 22px; letter-spacing: .3em; color: var(--muted);
    font-weight: 600; margin: 64px 0 24px;
  }
  .mirror {
    display: flex; gap: 28px;
    padding: 34px 0;
    border-top: 1px solid var(--line);
  }
  .mirror:last-child { border-bottom: 1px solid var(--line); }
  .mirror .n {
    flex: none; width: 60px; height: 60px; border-radius: 50%;
    border: 1.5px solid var(--accent); color: var(--accent);
    font-family: var(--serif); font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .mirror .t { font-family: var(--serif); font-size: 38px; line-height: 1.4; font-weight: 600; }
  .mirror .r { margin-top: 12px; font-size: 28px; line-height: 1.65; color: var(--muted); }

  .ai {
    background: var(--sage); color: var(--sage-ink);
    border-radius: 18px; padding: 36px 40px;
    font-size: 30px; line-height: 1.65;
  }
  .question {
    margin-top: 72px; text-align: center;
    font-family: var(--serif); font-size: 44px; line-height: 1.5;
    padding: 0 24px;
  }
  .question .q-mark { display: block; color: var(--accent); font-size: 26px; letter-spacing: .3em; margin-bottom: 20px; font-family: var(--sans); }
  .exp {
    margin-top: 56px;
    border-left: 4px solid var(--accent);
    padding: 8px 0 8px 28px;
    font-size: 28px; line-height: 1.65;
  }
  .exp b { display: block; font-size: 22px; letter-spacing: .3em; color: var(--accent); margin-bottom: 8px; }

  .foot {
    margin-top: 72px; padding-top: 28px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; color: var(--muted);
  }
  .foot .name { font-family: var(--serif); font-size: 26px; color: var(--ink); }
  .sig { display: flex; align-items: center; gap: 12px; letter-spacing: .12em; }

  @media (max-width: 720px) {
    .page { padding: 24px 16px; }
    .frame { padding: 32px 22px 28px; }
    h1 { font-size: 40px; }
    .numbers { flex-direction: column; }
    .mirror .t { font-size: 26px; }
    .mirror .r, .ai, .exp { font-size: 19px; }
    .question { font-size: 28px; }
    .num .v { font-size: 44px; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="frame">
    <div class="mark">
      <!-- 日与月：Melete 的小徽记 -->
      <svg width="48" height="40" viewBox="0 0 48 40" aria-hidden="true">
        <circle cx="12" cy="20" r="9" fill="none" stroke="#A4492A" stroke-width="1.6"/>
        <circle cx="34" cy="20" r="8" fill="#A4492A" opacity=".85"/>
        <circle cx="37.5" cy="17" r="7" fill="#F4EEE3"/>
      </svg>
      <span>{{label.mark}}</span>
    </div>

    <h1>{{title}}</h1>
    <p class="range">{{range}}</p>
    <!--if:by--><p class="by">{{by}}</p><!--/if:by-->

    <div class="rule" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 1l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </div>

    <!--if:numbers-->
    <div class="numbers">
      <!--each:numbers-->
      <div class="num"><div class="v">{{.value}}</div><div class="l">{{.label}}</div></div>
      <!--/each:numbers-->
    </div>
    <!--/if:numbers-->

    <h2>{{label.mirrors}}</h2>
    <div class="mirrors">
      <!--each:mirrors-->
      <div class="mirror">
        <div class="n">{{.n}}</div>
        <div><p class="t">{{.title}}</p><p class="r">{{.line}}</p></div>
      </div>
      <!--/each:mirrors-->
    </div>

    <!--if:ai-->
    <h2>{{label.ai}}</h2>
    <p class="ai">{{ai}}</p>
    <!--/if:ai-->

    <!--if:experiment-->
    <p class="exp"><b>{{label.experiment}}</b>{{experiment}}</p>
    <!--/if:experiment-->

    <!--if:question-->
    <p class="question"><span class="q-mark">{{label.question}}</span>{{question}}</p>
    <!--/if:question-->

    <div class="foot">
      <span class="name">{{name}}</span>
      <!--if:signature--><span class="sig">{{label.signature}}</span><!--/if:signature-->
    </div>
  </section>
</main>
</body>
</html>
